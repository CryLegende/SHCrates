# ======================================================================== #
#                SHCrates - Fichier de Messages (messages.yml)             #
# ======================================================================== #
#
# Vous pouvez utiliser les codes couleurs standards de Minecraft avec '&'.
# Exemples: &a, &b, &1, &2, &l (gras), &o (italique), etc.
#
# Pour désactiver un message, mettez une chaîne vide : ""
#
# Placeholders disponibles (liste non exhaustive, dépend du contexte):
#   %player_name% - Nom du joueur
#   %player_uuid% - UUID du joueur
#   %target_player% - Nom du joueur cible
#   %crate_name% - ID de la caisse (nom du fichier .yml)
#   %crate_display_name% - Nom d'affichage de la caisse
#   %key_name% - Nom d'affichage de la clé
#   %reward_display_name% - Nom d'affichage de la récompense
#   %amount% - Une quantité numérique
#   %command% - Une commande
#   %details% - Détails d'une erreur
#   %chance% - Chance de gagner une récompense (pour le lore du preview)
#
# ======================================================================== #

# Préfixe global pour la plupart des messages du plugin.
prefix: "" # Laissé vide car le préfixe est ajouté à chaque message individuellement

