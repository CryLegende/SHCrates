# ID interne unique pour cette caisse.
InternalID: 14660341-49c1-4ad0-a53f-c2e943292d4a # Sera généré par SHCrates

# Nom d'affichage de la caisse.
DisplayName: '&e&lBox Ordinaire' # Importé de CrateName

LogFile: Box_Ordinaire

# Type de bloc que cette caisse prendra.
BlockType: BARRIER # Importé de Item (de la section Crate principale)

# Configuration de la clé physique.
Key:
  Material: TRIPWIRE_HOOK # Importé de PhysicalKey.Item
  Name: '&eClé Ordinaire' # Importé de PhysicalKey.Name
  Lore: # Importé de PhysicalKey.Lore
    - '&7Ces clés sont obtenables'
    - '&7en votant pour Skyhand !'
    - '&7'
    - '&8&l» &ehttps://skyhand.fr/vote'
    - '&7'
    - '&7Clic droit sur la box &eOrdinaire'
  Enchanted: true # Importé de PhysicalKey.Glowing

# Configuration du GUI de preview.
PreviewGUI:
  Title: '&7&l« &e&lBox Ordinaire &8&l» &7(aperçu)' # Importé de Preview-Name
  Size: 54 # Importé de Preview.ChestLines (6 lignes * 9 slots = 54)
  # NOUVELLE section FillerItems (une liste)
  FillerItems:
    # Filler par défaut pour les slots non spécifiés (optionnel)
    # DefaultFiller:
    #   Material: "GRAY_STAINED_GLASS_PANE"
    #   Name: " "
    # Pas de slots ni de commandes ici

        # Fillers spécifiques
    # bordure: # Un ID unique pour ce groupe de fillers
    #   Material: BLACK_STAINED_GLASS_PANE
    #   Name: ' '
    #   Slots: 0,1,2,3,4,5,6,7,8
    retour_menu_box:
      Material: PAPER
      Name: '&c⤾ Retour &7(Clic)'
      Lore:
      - ''
      Slots: '49' # Slot unique
      CommandsOnClick: # Commandes exécutées si on clique sur ce filler
        - dm open box %player_name%
    info_speciale:
      Material: BOOK
      Name: '&eInformations'
      Lore:
      - '&7Cette caisse contient des items rares !'
      Slots: '54' # Un slot spécifique
  # Pas de CommandsOnClick ici, c'est juste informatif

  ItemsPerPage: 21 # Valeur par défaut de SHCrates, à ajuster si besoin
  Layout:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  Buttons:
    NextPage:
      Slot: 50
      Item:
        Material: ARROW
        Name: '&fPage Suivante'
    PreviousPage:
      Slot: 48
      Item:
        Material: ARROW
        Name: '&fPage Précédente'
# Vous pouvez ajouter un bouton "Fermer" ici si vous le souhaitez

# Configuration de l'animation.
Animation:
  Type: QuickCrate # Importé de CrateType: QuickCrate
# GUITitle: "&8Ouverture..." # Non applicable pour QuickCrate, mais pourrait être défini pour d'autres types
# SpinDurationTicks: 100 # Non applicable pour QuickCrate
# SoundOpen: "BLOCK_CHEST_OPEN" # À définir si vous voulez des sons spécifiques
# SoundSpin: "ENTITY_EXPERIENCE_ORB_PICKUP"
  SoundWin: ENTITY_EXPERIENCE_ORB_PICKUP
  QuickCrateAnimation:
    Enabled: true # Car CrateType est QuickCrate
    DurationSeconds: 3
    DisplayHologram: true
    # Hauteur de base de l'item par rapport au bloc (1.0 = 1 bloc de haut).
    ItemHeightOffset: 2.2
    # Hauteur du texte par rapport à l'item (0.5 = un demi-bloc au-dessus de l'item).
    HologramHeightOffset: 0.5 

