    DisplayName: '&e1000 pièces'
    DisplayItem: PAPER
    DisplayAmount: 1
    Lore: []
    Chance: 15
    Palier: commun
    Condition: 'solde-ordinaire'
    FireworkOnWin: false
    GlowingDisplayItem: false
    HideItemFlags: true
    Commands:
    - 'eco give %player_name% 1000'

