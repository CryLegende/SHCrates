# --- Les récompenses commentées de votre ancien fichier ---
# J'ai omis de les convertir pour ne pas surcharger, mais le principe est le même.
# Vous devrez traduire les ID numériques d'items (ex: '265') en noms de matériaux Minecraft (ex: 'IRON_INGOT').
# La commande 'give %player% 310 1 0 {display:{Name:"&8[&7Casque ordinaire&8]"},ench:[{id:0,lvl:3},{id:34,lvl:2}]}'
# deviendrait (pour Protection III, Unbreaking II sur un casque en diamant):
# 'give %player_name% diamond_helmet{display:{Name:"{\\"text\\":\\"[Casque ordinaire]\\"}"},Enchantments:[{id:protection,lvl:3},{id:unbreaking,lvl:2}]} 1'
# Les ID d'enchantement numériques doivent être remplacés par leurs noms (protection, unbreaking, etc.).
