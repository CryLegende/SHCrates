# ======================================================================== #
#                  SHCrates - Configuration Principale                     #
# ======================================================================== #
#
# Plugin : caisses à récompenses avec clés physiques ou virtuelles, aperçu
# des lots, ouverture multiple, paliers de rareté, jauge de garantie, première
# clé garantie et lots en rotation mensuelle.
#
# Ce fichier contient les paramètres globaux du plugin SHCrates.
# Pour la configuration des caisses individuelles, voir le dossier 'crates/'.
# Pour les messages, voir 'messages.yml'.
#
# Avec SHNetwork (plusieurs serveurs de jeu), les clés virtuelles sont dans une base partagée (section 'reseau'
# en bas du fichier). Les blocs de caisse (locations.yml) restent propres à chaque serveur : ils vivent dans les
# mondes du serveur où ils ont été posés, qui n'existent pas forcément sur les autres, donc les caisses physiques
# ne se trouvent que là. Les clés physiques sont des objets et suivent le joueur.
#
# Commandes : /crate (joueurs) et /shcrates (administration, alias /shcr). Chacune accepte toutes les sous-commandes,
# sous réserve des permissions ; sans argument, une ligne d'usage ne liste que celles que l'expéditeur peut utiliser.
#   /crate preview <caisse> [joueur]                              Ouvre l'aperçu d'une caisse.
#   /crate open <caisse> [joueur]                                 Ouvre une caisse.
#   /crate openall <caisse> [joueur]                              Ouvre toutes les clés d'une caisse (aussi Shift+clic
#                                                                 droit sur le bloc d'une QuickCrate), avec un récapitulatif.
#   /crate keys [joueur]                                          Affiche les clés d'un joueur.
#   /crate stats [joueur]                                         Clés ouvertes, meilleur palier, jauge et collection par caisse.
#   /crate list                                                   Liste les caisses.
#   /shcrates givekey <joueur> <caisse> <nombre> [physical|virtual]  Donne des clés à un joueur.
#   /shcrates takekey <joueur> <caisse> <nombre> [physical|virtual]  Retire des clés à un joueur.
#   /shcrates giveall <caisse> <nombre> [physical|virtual]           Donne des clés à tous les joueurs en ligne.
#   /shcrates setblock <caisse>                                      Définit le bloc visé comme caisse.
#   /shcrates removeblock                                            Retire la caisse du bloc visé.
#   /shcrates info <caisse>                                          Nom, bloc, clé, animation, récompenses et blocs posés.
#   /shcrates reload                                                 Relit config.yml, messages.yml, crates/ et locations.yml. Un
#                                                                    fichier illisible ou une caisse inutilisable annule tout.
#   /shcrates import                                                 Avec SHNetwork : copie les clés virtuelles de playerdata/ dans la base.
#
# Permissions :
#   shcrates.use                    Utiliser /crate et les sous-commandes joueur (par défaut : tous les joueurs).
#   shcrates.list                   /crate list (par défaut : op).
#   shcrates.keys                   /crate keys (par défaut : op).
#   shcrates.open.<caisse|*>        Ouvrir une caisse, par exemple shcrates.open.ordinaire (par défaut : op).
#   shcrates.preview.<caisse|*>     Voir l'aperçu d'une caisse, par exemple shcrates.preview.rare (par défaut : op).
#   shcrates.reroll.<caisse|*>      Relancer une récompense, par exemple shcrates.reroll.legendaire (par défaut : op).
#   shcrates.removeblock.<caisse>   Casser le bloc d'une caisse, par exemple shcrates.removeblock.noel (par défaut : op).
#   shcrates.bypass.creative        Ouvrir une caisse en mode créatif (par défaut : op, ne se déduit pas de shcrates.admin).
#   shcrates.admin.statsothers      /crate stats d'un autre joueur.
#   shcrates.admin                  Toutes les commandes d'administration, et l'aperçu et l'ouverture de toutes les caisses
#                                   (par défaut : op).
#   shcrates.admin.<commande>       Une commande d'administration : givekey, takekey, giveall, setblock, removeblock,
#                                   reload, import, info.
#   shcrates.admin.previewothers    Ouvrir l'aperçu d'un autre joueur.
#   shcrates.admin.openothers       Ouvrir une caisse pour un autre joueur.
#   shcrates.admin.keysothers       Voir les clés d'un autre joueur.
#   shcrates.*                      Tous les droits ci-dessus.
#
#
# Clés propres à chaque caisse (fichiers de crates/) :
#   OuvertureMultiple: false        Refuse /crate openall et le Shift+clic : une clé à la fois (par défaut : true).
#   AnnonceReception: true          Message (key_received_announce), son (son_cle_recue) et état de la jauge quand le
#                                   joueur reçoit des clés de cette caisse (par défaut : false).
#   PremiereOuverture: tres_rare    La toute première clé ouverte par un joueur tire seulement parmi les lots de ce
#                                   palier ou d'un palier plus haut.
#   Jauge:                          Après Seuil - 1 clés sans lot d'un des Paliers, la clé suivante tire seulement parmi
#     Seuil: 30                     ces paliers. La jauge repart à zéro dès qu'un de ces lots sort, garanti ou non.
#     Paliers: [legendaire]
#     Nom: "&6Jauge Légendaire"
#   Rotation:                       Un seul des Lots est gagnable chaque mois, à tour de rôle depuis Debut (AAAA-MM) ;
#     Debut: "2026-12"              les autres sont absents de l'aperçu et du tirage.
#     Lots: [lotA, lotB]
# Clés propres à chaque récompense :
#   Palier: rare                    Palier de rareté (section 'paliers' ci-dessous) : ligne « Rareté » dans l'aperçu,
#                                   son, feu d'artifice, titre et annonce. Sans palier : son SoundWin de la caisse et
#                                   FireworkOnWin, comme avant.
#   Condition: solde-legendaire     Lot gagnable (et visible) seulement si la condition est vraie : nom d'une condition de
#                                   la section 'conditions' ci-dessous, ou expression écrite sur le lot
#                                   ("%superior_island_level% < 5000"). Opérateurs < <= > >= == !=.
# Les commandes des récompenses passent aussi par PlaceholderAPI (montants qui suivent le joueur).
# ======================================================================== #

# --- Paramètres Généraux ---

# Activer le mode debug pour des logs plus détaillés en console.
# Utile pour le développement ou le diagnostic de problèmes.
# Valeurs possibles: true, false
debug_mode: false

# Nom du tag NBT utilisé pour identifier les clés physiques des caisses.
# IMPORTANT: Changer cette valeur après que des clés aient été distribuées
# rendra les anciennes clés invalides.
physical_key_nbt_tag: "SHCrates_KeyID"

# Animation par défaut à utiliser si aucune n'est spécifiée dans la configuration
# d'une caisse individuelle.
# Types d'animations disponibles (doivent correspondre aux noms enregistrés dans AnimationManager):
#   NONE, QUICKCRATE, ROULETTE, CSGO, WHEEL
default_animation_type: "ROULETTE"

# --- Interaction avec les Caisses Physiques ---

# Configurer le comportement lorsqu'un joueur clique sur une caisse physique sans la clé requise.
knockback_on_no_key:
  # Activer ou désactiver le repoussement du joueur.
  enabled: true
  # Force du repoussement. Des valeurs plus élevées signifient un repoussement plus fort.
  # Une valeur de 0.5 est modérée.
  strength: 0.8

# --- Ouverture de Caisses ---

# Activer le log des récompenses gagnées par les joueurs dans la console du serveur.
log_rewards_to_console: true

# Ligne écrite dans SHLogs pour chaque récompense gagnée.
# Le fichier de log de chaque caisse se règle avec LogFile dans crates/.
# Variables : %player_name%, %reward_name%.
reward_log_format: "%player_name% gagne %reward_name%"


# --- Stockage des Données ---
storage:
  # Nom du fichier (dans le dossier du plugin) utilisé pour stocker les emplacements
  # des blocs de caisse physiques.
  crate_locations_file: "locations.yml"

  # Type de stockage pour les clés virtuelles des joueurs (un serveur seul ; avec SHNetwork, voir 'reseau').
  # Actuellement, seul "YAML" est implémenté et pleinement supporté.
  # Options futures potentielles (non implémentées) : SQLITE, MYSQL
  virtual_keys_storage_type: "YAML" # Ne pas changer sauf si d'autres types sont ajoutés.

# --- Mode de Compatibilité ---
# Active un mode de compatibilité pour les clés physiques.
# Si activé, le plugin essaiera de reconnaître les clés basées sur leur nom et lore
# configurés dans la section 'Key' de chaque caisse, en plus des clés natives SHCrates (avec NBT).
# UTILE POUR LA TRANSITION DEPUIS UN ANCIEN PLUGIN DE CAISSES.
# ATTENTION: Ce mode est moins sécurisé car les joueurs pourraient renommer des items pour correspondre.
# À désactiver une fois la transition terminée.
compatibility_mode:
  enabled: false # Mettre à true pour activer
  # Optionnel: Exiger que le matériau corresponde aussi en mode compatibilité (recommandé)
  match_material: false
  # Optionnel: Exiger que le lore corresponde exactement (true) ou juste contienne les lignes (false)
  match_lore_exactly: false # Si true, l'ordre et le contenu de chaque ligne de lore doivent être identiques.
                           # Si false, l'item doit juste contenir toutes les lignes de lore configurées (peut être plus flexible).

# Délai en secondes avant qu'un GUI d'animation ne se ferme automatiquement après avoir fini.
# Cela laisse le temps au joueur de voir sa récompense et de décider de relancer.
# Mettre à -1 pour désactiver la fermeture automatique.
auto_close_gui_delay_seconds: -1

# --- Ouverture multiple (/crate openall, Shift+clic sur une QuickCrate) ---
ouverture_multiple:
  # Nombre maximal de clés ouvertes en une fois
  max: 200
  # Clés ouvertes par tick : plus haut, l'ouverture est plus rapide mais pèse davantage sur un seul tick
  par_tick: 20

# Conditions nommées : une récompense peut écrire « Condition: <nom> » au lieu de l'expression, la valeur se change
# alors ici pour tous les lots qui l'utilisent. Les deux côtés passent par PlaceholderAPI ; opérateurs < <= > >= == !=.
conditions:
  # Lots d'argent de la caisse Légendaire : joueurs sous ce solde seulement
  solde-legendaire: "%vault_eco_balance% < 10000000"
  # Lots d'argent de la caisse Rare : joueurs sous ce solde seulement
  solde-rare: "%vault_eco_balance% < 1000000"
  # Lots d'argent de la caisse Ordinaire : joueurs sous ce solde seulement
  solde-ordinaire: "%vault_eco_balance% < 100000"

# Nombre de segments de la barre %shcrates_jauge_barre_<caisse>%
jauge_barre_segments: 20

# Son joué quand un joueur reçoit des clés d'une caisse qui a « AnnonceReception: true »
son_cle_recue: ENTITY_EXPERIENCE_ORB_PICKUP

# --- Paliers de rareté ---
# Chaque récompense peut désigner un palier avec « Palier: <id> ». Le rang ordonne les paliers (1 = le plus courant) :
# meilleur lot d'une ouverture multiple, palier minimal de PremiereOuverture, statistiques.
#   nom           Nom affiché, avec sa couleur.
#   vitre         Vitre du cadre de la roulette quand elle ralentit sur un lot de ce palier ("" : cadre inchangé).
#   son           Son joué au joueur quand le lot apparaît (ancien nom ou clé), volume et hauteur.
#   feu-artifice  Feu d'artifice au-dessus du bloc de la caisse (ou du joueur pour une ouverture par commande).
#   totem         Animation du totem d'immortalité sur l'écran du joueur ; elle joue son propre son.
#   titre         Titre et sous-titre affichés au joueur ("" : aucun), %reward% = nom du lot.
#   annonce       Annonce du gain à tout le serveur (message announce_win).
paliers:
  commun:
    rang: 1
    nom: "&7Commun"
    vitre: ""
    son: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    hauteur: 1.2
  rare:
    rang: 2
    nom: "&bRare"
    vitre: LIGHT_BLUE_STAINED_GLASS_PANE
    son: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    hauteur: 1.3
  tres_rare:
    rang: 3
    nom: "&5Très rare"
    vitre: PURPLE_STAINED_GLASS_PANE
    son: UI_TOAST_CHALLENGE_COMPLETE
    volume: 0.9
    hauteur: 1.1
    feu-artifice: true
    titre: "&5&lTRÈS RARE"
    sous-titre: "%reward%"
  legendaire:
    rang: 4
    nom: "&6Légendaire"
    vitre: ORANGE_STAINED_GLASS_PANE
    son: ""
    feu-artifice: true
    totem: true
    titre: "&6&lLÉGENDAIRE"
    sous-titre: "%reward%"
    annonce: true

# --- Paramètres de Relance (Reroll) ---
# Permet aux joueurs de relancer une récompense à la fin d'une animation.
# NE s'applique PAS aux animations QUICKCRATE ou NONE.
reroll:
  # Activer ou désactiver la fonctionnalité de relance globalement.
  enabled: true
  
  # Les joueurs auront besoin de la permission 'shcrates.reroll.<cratename>' ou 'shcrates.reroll.*'
  # et ne pourront relancer qu'une seule fois par ouverture.
  
  # Slot où le bouton de relance apparaîtra dans les animations GUI (de 0 à 53).
  # Assurez-vous que ce slot n'est pas utilisé par le layout de votre animation.
  # Pour ROULETTE/CSGO (27 slots), 22 (en bas au centre) est un bon choix.
  # Pour WHEEL (45 slots), 4 (en haut au centre) peut être meilleur.
  reroll_button_slot: 22

  # Configuration de l'item du bouton de relance.
  reroll_button:
    material: "ENDER_EYE"
    name: "&a&lRELANCER"
    lore:
      - "&7Vous avez une chance de relancer."
      - "&7Cliquez pour essayer d'obtenir"
      - "&7une meilleure récompense !"
    glowing: true

  # Configuration du bouton affiché lorsque le joueur a déjà utilisé sa relance.
  reroll_used_button:
    material: "BARRIER"
    name: "&c&lRELANCE UTILISÉE"
    lore:
      - "&7Vous avez déjà utilisé votre"
      - "&7relance pour cette ouverture."

# --- Mode réseau ---
# Actif seulement si SHNetwork est installé et 'actif' vaut true : les clés virtuelles sont alors dans la base
# partagée (table shcrates_keys : uuid, crate, amount) au lieu de playerdata/. Elles sont lues à la connexion du
# joueur, une fois que l'autre serveur a fini de le sauvegarder, puis chaque changement est écrit en base sous forme
# d'écart (+n ou -n). Les commandes givekey, takekey et open visant un joueur d'un autre serveur lui sont transmises.
# Les clés déjà dans playerdata/ se copient une fois avec /shcrates import (rien n'est écrasé).
# Sans SHNetwork, rien de ceci n'est utilisé. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de lire ses clés
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: minecraft
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # empêche d'ouvrir une caisse avec une clé virtuelle tant qu'elle ne répond pas, sans rien faire perdre.
    delai-ms: 3000
