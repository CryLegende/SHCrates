name: SHCrates
version: '${project.version}'
main: org.Cry_Legende.sHCrates.SHCrates
api-version: '1.20'
author: Cry_Legende
softdepend:
  - PlaceholderAPI
  - Vault
  - SHLogs
  # SHNetwork est facultatif : sans lui, les clés virtuelles restent dans les fichiers de ce serveur comme avant.
  - SHNetwork
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (clés virtuelles en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shcrates:
    description: Administration de SHCrates (clés, blocs de caisse, rechargement).
    aliases:
      - shcr
    usage: /shcrates <givekey|takekey|giveall|setblock|removeblock|info|reload|import>
  crate:
    description: Aperçu, ouverture et clés des caisses.
    usage: /crate <preview|open|openall|keys|list>

permissions:
  shcrates.*:
    description: Donne accès à toutes les fonctionnalités de SHCrates.
    children:
      shcrates.admin: true
      shcrates.use: true
      # Les permissions d'ouverture/preview par caisse sont dynamiques (ex: shcrates.open.ordinaire)

  shcrates.use:
    description: Utiliser /crate et les sous-commandes joueur de /shcrates (preview, open, openall).
    default: true
  shcrates.list:
    description: /crate list, la liste des caisses.
    default: op
  shcrates.keys:
    description: /crate keys, voir ses clés.
    default: op
  shcrates.open.*:
    description: Ouvrir n'importe quelle caisse (par caisse, shcrates.open.<caisse>).
    default: op
  shcrates.preview.*:
    description: Voir l'aperçu de n'importe quelle caisse (par caisse, shcrates.preview.<caisse>).
    default: op
  shcrates.reroll.*:
    description: Relancer la récompense de n'importe quelle caisse (par caisse, shcrates.reroll.<caisse>).
    default: op
  shcrates.bypass.creative:
    description: Ouvrir une caisse en mode créatif.
    default: op

  shcrates.admin:
    description: Toute l'administration de SHCrates, et l'aperçu et l'ouverture de toutes les caisses.
    default: op
    children:
      shcrates.admin.reload: true
      shcrates.admin.givekey: true
      shcrates.admin.takekey: true
      shcrates.admin.giveall: true
      shcrates.admin.setblock: true
      shcrates.admin.removeblock: true
      shcrates.admin.import: true
      shcrates.admin.info: true
      shcrates.admin.previewothers: true
      shcrates.admin.openothers: true
      shcrates.admin.keysothers: true
  shcrates.admin.reload:
    description: Recharger la configuration, les messages, les caisses et les emplacements.
    default: op
  shcrates.admin.givekey:
    description: Donner des clés à un joueur.
    default: op
  shcrates.admin.takekey:
    description: Retirer des clés à un joueur.
    default: op
  shcrates.admin.giveall:
    description: Donner des clés à tous les joueurs en ligne.
    default: op
  shcrates.admin.setblock:
    description: Définir le bloc visé comme caisse.
    default: op
  shcrates.admin.removeblock:
    description: Retirer une caisse du bloc visé, ou casser un bloc de caisse.
    default: op
  shcrates.admin.import:
    description: Copier les clés virtuelles de playerdata/ dans la base du réseau.
    default: op
  shcrates.admin.info:
    description: Consulter une caisse chargée.
    default: op
  shcrates.admin.previewothers:
    description: Ouvrir l'aperçu d'une caisse pour un autre joueur.
    default: op
  shcrates.admin.openothers:
    description: Ouvrir une caisse pour un autre joueur.
    default: op
  shcrates.admin.keysothers:
    description: Voir les clés d'un autre joueur.
    default: op
